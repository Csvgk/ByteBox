{% extends 'base.html' %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-5">
            <div class="panel auth-card">
                <h1 class="page-title mb-4">Вхід</h1>
                <form method="post">
                    {% csrf_token %}
                    {% include 'includes/form_fields.html' %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-accent w-100">Увійти</button>
                </form>
                <p class="mt-3 mb-0 text-center">Немає акаунта? <a href="{% url 'accounts:register' %}">Зареєструватися</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
