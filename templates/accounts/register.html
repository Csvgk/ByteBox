{% extends 'base.html' %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-6">
            <div class="panel auth-card">
                <h1 class="page-title mb-4">Реєстрація</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'includes/form_fields.html' %}
                    <button type="submit" class="btn btn-accent w-100">Створити акаунт</button>
                </form>
                <p class="mt-3 mb-0 text-center">Вже є акаунт? <a href="{% url 'accounts:login' %}">Увійти</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
