{% extends 'base.html' %}
{% block title %}Видалити статтю{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="panel text-center">
                <i class="bi bi-exclamation-triangle text-danger fs-1"></i>
                <h1 class="h4 fw-bold mt-2">Видалити статтю?</h1>
                <p>«{{ post.title }}» буде видалено разом з коментарями. Цю дію не можна скасувати.</p>
                <form method="post" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <a href="{{ post.get_absolute_url }}" class="btn btn-light">Скасувати</a>
                    <button type="submit" class="btn btn-danger">Так, видалити</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
